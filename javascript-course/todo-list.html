<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #6a5af9, #d66efd);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 20px;
  }

  .app {
    background: #fff;
    width: 100%;
    max-width: 420px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    padding: 28px;
  }

  h1 {
    margin: 0 0 20px;
    font-size: 24px;
    color: #2b2b3d;
    text-align: center;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  #taskInput {
    flex: 1;
    padding: 12px 14px;
    border: 2px solid #eee;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  #taskInput:focus {
    border-color: #6a5af9;
  }

  #addBtn {
    background: #6a5af9;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 20px;
    cursor: pointer;
    transition: background 0.2s;
  }

  #addBtn:hover {
    background: #5847e8;
  }

  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }

  .filter-btn {
    flex: 1;
    padding: 8px;
    border: none;
    background: #f2f2f7;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    color: #666;
    transition: all 0.2s;
  }

  .filter-btn.active {
    background: #6a5af9;
    color: #fff;
  }

  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 340px;
    overflow-y: auto;
  }

  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 4px;
    border-bottom: 1px solid #f0f0f5;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #6a5af9;
    flex-shrink: 0;
  }

  li span {
    flex: 1;
    font-size: 15px;
    color: #333;
    word-break: break-word;
  }

  li.completed span {
    text-decoration: line-through;
    color: #aaa;
  }

  li button.delete {
    background: none;
    border: none;
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    transition: color 0.2s;
  }

  li button.delete:hover {
    color: #ff5c5c;
  }

  .empty-state {
    text-align: center;
    color: #bbb;
    padding: 30px 0;
    font-size: 14px;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    font-size: 13px;
    color: #999;
  }

  .footer button {
    background: none;
    border: none;
    color: #999;
    cursor: pointer;
    font-size: 13px;
    text-decoration: underline;
  }

  .footer button:hover {
    color: #6a5af9;
  }
</style>
</head>
<body>

<div class="app">
  <h1>📝 My To-Do List</h1>

  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="120">
    <button id="addBtn">+</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
  </div>

  <ul id="taskList"></ul>

  <div class="footer">
    <span id="itemCount">0 items left</span>
    <button id="clearCompleted">Clear completed</button>
  </div>
</div>

<script>
  let tasks = [];
  let currentFilter = 'all';

  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const taskList = document.getElementById('taskList');
  const itemCount = document.getElementById('itemCount');
  const clearCompletedBtn = document.getElementById('clearCompleted');
  const filterBtns = document.querySelectorAll('.filter-btn');

  function addTask() {
    const text = taskInput.value.trim();
    if (!text) return;
    tasks.push({ id: Date.now(), text, completed: false });
    taskInput.value = '';
    render();
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    render();
  }

  function clearCompleted() {
    tasks = tasks.filter(t => !t.completed);
    render();
  }

  function setFilter(filter) {
    currentFilter = filter;
    filterBtns.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === filter);
    });
    render();
  }

  function render() {
    let filtered = tasks;
    if (currentFilter === 'active') filtered = tasks.filter(t => !t.completed);
    if (currentFilter === 'completed') filtered = tasks.filter(t => t.completed);

    taskList.innerHTML = '';

    if (filtered.length === 0) {
      taskList.innerHTML = '<li class="empty-state" style="border:none;">No tasks here 🎉</li>';
    } else {
      filtered.forEach(task => {
        const li = document.createElement('li');
        li.className = task.completed ? 'completed' : '';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        checkbox.addEventListener('change', () => toggleTask(task.id));

        const span = document.createElement('span');
        span.textContent = task.text;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', () => deleteTask(task.id));

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        taskList.appendChild(li);
      });
    }

    const remaining = tasks.filter(t => !t.completed).length;
    itemCount.textContent = `${remaining} item${remaining !== 1 ? 's' : ''} left`;
  }

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });
  clearCompletedBtn.addEventListener('click', clearCompleted);
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => setFilter(btn.dataset.filter));
  });

  render();
</script>

</body>
</html>
